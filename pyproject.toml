[project]
name = "srsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "fastapi>=0.121.1",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.0",
]


[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "cz-conventional-gitmoji>=0.7.0",
    "httpx>=0.28.1",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.commitizen]
name = "cz_gitmoji"
version_provider = "uv"
annotated_tag = true
tag_format = "v$version"
bump_message = "🔖 bump: release $current_version → $new_version"
